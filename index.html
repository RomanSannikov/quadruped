<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Robot Control</title>
</head>
<body>
    <h1>Quadruped Robot Control</h1>
    <p>Press any arrow key to make the robot trot.</p>
    <script>
        document.addEventListener('keydown', function(event) {
            if (['ArrowUp'].includes(event.key)) {
                fetch('/moveForward', { method: 'POST' })
                    .then(response => {
                        if (response.ok) {
                            console.log('Trot triggered');
                        } else {
                            console.error('Failed to trigger trot');
                        }
                    })
                    .catch(error => console.error('Error:', error));
            } else if (['ArrowDown'].includes(event.key)) {
                fetch('/moveBackwards', { method: 'POST' })
                    .then(response => {
                        if (response.ok) {
                            console.log('Trot triggered');
                        } else {
                            console.error('Failed to trigger trot');
                        }
                    })
                    .catch(error => console.error('Error:', error));
            }
        });
    </script>
</body>
</html>
